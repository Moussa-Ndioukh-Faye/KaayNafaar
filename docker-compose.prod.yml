# ============================================
# Kaay Nafaar — Docker Compose Production (VPS)
# Usage: docker compose -f docker-compose.prod.yml up -d
# Frontend déployé séparément sur Vercel
# ============================================

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revision-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-user_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_secret}
      POSTGRES_DB: ${DB_NAME:-kaay_nafaar_v2}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user_admin} -d ${DB_NAME:-kaay_nafaar_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: revision-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revision-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      NODE_ENV: production
      PORT: "5001"
      FRONTEND_URL: ${FRONTEND_URL:-https://kaay-nafaar.vercel.app}
      REDIS_HOST: redis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - internal

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: revision-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiY2UwOTQ5YzQ1ZDQwYWI5MTIyZjI1NmUwMDM5NjQwYzIiLCJ0IjoiZjg0ZjQzMjMtMzQyZC00ZjQwLTk3MzYtYWMzMjg4MDM5MmViIiwicyI6Ik5ESTVaalF4TUdZdFpURmlOQzAwTWpsbUxXRmhNREl0WmpjNVltSXpOakppT1RjdyJ9
    depends_on:
      - backend
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: revision-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${CADDY_DOMAIN:-185-98-136-82.sslip.io}
      BACKEND_URL: http://backend:5001
    depends_on:
      - backend
    networks:
      - internal
