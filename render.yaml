# Blueprint Render — backend Kaay Nafaar (offre gratuite)
# Render → New → Blueprint → choisir ce dépôt. La base est sur Supabase (DATABASE_URL).
services:
  - type: web
    name: kaay-nafaar-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /api/health
    # Déploie main uniquement quand la CI GitHub est verte
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://kaay-nafaar.vercel.app
      - key: JWT_EXPIRE
        value: 7d
      # Modèles IA (modifiables ici quand un fournisseur retire un modèle)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_SECOURS
        value: gemini-3.5-flash-lite
      - key: LECTURE_IA
        value: toujours
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      # GROQ_MODEL facultatif : le serveur lit la liste des modèles Groq disponibles et choisit le meilleur
      # Sécurité : Vercel (rewrite /api) + Render = 2 proxys devant le serveur
      - key: TRUST_PROXY
        value: "2"
      - key: AI_QUOTA_JOUR
        value: "100"
      - key: IMPORTS_QUOTA_JOUR
        value: "20"
      # Adresse qui reçoit les alertes d'activité suspecte (optionnel)
      - key: SECURITY_ALERT_EMAIL
        sync: false
      # Secrets générés par Render (64 caractères aléatoires)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # À renseigner dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Vérification des emails (API HTTP Brevo : Render gratuit bloque le SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
