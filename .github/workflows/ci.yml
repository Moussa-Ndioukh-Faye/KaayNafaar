name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : le jeton GitHub n'a qu'un accès en lecture
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Échoue si une faille haute ou critique touche les dépendances de production
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          # Valeurs factices réservées aux tests
          JWT_SECRET: ci-test-secret-not-for-production-0123456789
          COOKIE_SECRET: ci-cookie-secret-not-for-production-0123456789
          GEMINI_API_KEY: ci-dummy-key

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint -- --max-warnings 0
        working-directory: frontend

  # Le déploiement du backend est assuré par Render (render.yaml) :
  # il se déclenche automatiquement sur main une fois toutes ces vérifications passées.
